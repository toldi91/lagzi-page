<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <meta name="theme-color" content="#7a1f2b" />
    <style>
        html,
        body {
            background: #15090c;
        }

        body {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <noscript>
        <style>
            body {
                visibility: visible;
                opacity: 1;
                pointer-events: auto;
            }
        </style>
    </noscript>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/hero.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/sections.css" />
    <link rel="stylesheet" href="css/helyszin.css" />
    <link rel="stylesheet" href="css/menetrend.css" />
    <link rel="stylesheet" href="css/naszajandek.css" />
    <link rel="stylesheet" href="css/gallery.css" />
    <link rel="stylesheet" href="css/countdown.css" />
    <link rel="stylesheet" href="css/dresscode.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/rsvp.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/i18n.css" />
</head>
<body class="i18n-pending page-loading">

<header class="hero">
    <div class="hero-content">
        <h1 class="hero-name" data-i18n="hero.bride"></h1>
        <h1 class="hero-name" data-i18n="hero.and"></h1>
        <h1 class="hero-name" data-i18n="hero.groom"></h1>
    </div>
</header>

<nav class="nav" id="main-nav">
    <button
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="nav-links"
        data-i18n-attr="aria-label:nav.toggleAria"
    >
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
    </button>
    <ul class="nav-links" id="nav-links">
        <li><a href="#visszaszamlalo" data-i18n="nav.countdown"></a></li>
        <li><a href="#helyszin" data-i18n="nav.location"></a></li>
        <li><a href="#menetrend" data-i18n="nav.schedule"></a></li>
        <li><a href="#naszajandek" data-i18n="nav.gift"></a></li>
        <li><a href="#dresscode" data-i18n="nav.dresscode"></a></li>
        <li><a href="#menu" data-i18n="nav.menu"></a></li>
        <li><a href="#visszaigazolas" data-i18n="nav.rsvp"></a></li>
    </ul>
</nav>

<main class="page-content">
<section id="datum" class="section alt reveal">
    <p class="our-big-day" data-i18n="date.bigDay"></p>
    <div class="calendar">
        <div class="calendar-header">
            <strong data-i18n="date.calendarHeader"></strong>
        </div>
        <div class="calendar-grid" role="grid" data-i18n-attr="aria-label:date.calendarAria">
            <div class="calendar-day" data-i18n="date.days.mon"></div>
            <div class="calendar-day" data-i18n="date.days.tue"></div>
            <div class="calendar-day" data-i18n="date.days.wed"></div>
            <div class="calendar-day" data-i18n="date.days.thu"></div>
            <div class="calendar-day" data-i18n="date.days.fri"></div>
            <div class="calendar-day" data-i18n="date.days.sat"></div>
            <div class="calendar-day" data-i18n="date.days.sun"></div>

            <div class="calendar-cell empty"></div>
            <div class="calendar-cell empty"></div>
            <div class="calendar-cell empty"></div>
            <div class="calendar-cell">1</div>
            <div class="calendar-cell">2</div>
            <div class="calendar-cell">3</div>
            <div class="calendar-cell">4</div>
            <div class="calendar-cell">5</div>
            <div class="calendar-cell">6</div>
            <div class="calendar-cell">7</div>
            <div class="calendar-cell">8</div>
            <div class="calendar-cell">9</div>
            <div class="calendar-cell">10</div>
            <div class="calendar-cell">11</div>
            <div class="calendar-cell">12</div>
            <div class="calendar-cell">13</div>
            <div class="calendar-cell">14</div>
            <div class="calendar-cell">15</div>
            <div class="calendar-cell">16</div>
            <div class="calendar-cell">17</div>
            <div class="calendar-cell">18</div>
            <div class="calendar-cell">19</div>
            <div class="calendar-cell">20</div>
            <div class="calendar-cell">21</div>
            <div class="calendar-cell">22</div>
            <div class="calendar-cell">23</div>
            <div class="calendar-cell highlight heart-outline" data-i18n-attr="aria-label:date.highlightAria">24</div>
            <div class="calendar-cell">25</div>
            <div class="calendar-cell">26</div>
            <div class="calendar-cell">27</div>
            <div class="calendar-cell">28</div>
            <div class="calendar-cell">29</div>
            <div class="calendar-cell">30</div>
            <div class="calendar-cell">31</div>
        </div>
    </div>
</section>

<section id="visszaszamlalo" class="section alt reveal">
    <h2 data-i18n="countdown.title"></h2>
    <div class="countdown" role="timer" aria-live="polite">
        <div class="countdown-item">
            <span class="countdown-value" data-unit="days">00</span>
            <span class="countdown-label" data-i18n="countdown.labels.days"></span>
        </div>
        <div class="countdown-item">
            <span class="countdown-value" data-unit="hours">00</span>
            <span class="countdown-label" data-i18n="countdown.labels.hours"></span>
        </div>
        <div class="countdown-item">
            <span class="countdown-value" data-unit="minutes">00</span>
            <span class="countdown-label" data-i18n="countdown.labels.minutes"></span>
        </div>
        <div class="countdown-item">
            <span class="countdown-value" data-unit="seconds">00</span>
            <span class="countdown-label" data-i18n="countdown.labels.seconds"></span>
        </div>
    </div>
</section>

<section id="helyszin" class="section alt reveal">
    <h2 data-i18n="location.title"></h2>
    <div class="tunderfarm-pic">
        <img src="./pics/tunderfarm.png" alt="" />
    </div>
    <div class="map-actions reveal">
        <a class="map-button" href="https://www.google.com/maps/dir/?api=1&destination=T%C3%BCnd%C3%A9r%20Farm%2C%208420%20Zirc%2C%20Esterh%C3%A1zy%20utca%2018" target="_blank" rel="noopener noreferrer">
            <img class="map-button-icon" src="icons/map-pin.png" alt="" aria-hidden="true" />
            <span data-i18n="location.mapName"></span><br>
            <span data-i18n="location.mapAddress"></span>
        </a>
    </div>
    <p class="section-text" data-i18n="location.parkingTitle"></p>
    <p class="section-text" data-i18n="location.parkingBody"></p>
</section>

<section id="menetrend" class="section alt reveal">
    <h2 data-i18n="schedule.title"></h2>
    <ul class="timeline">
        <li class="reveal">
            <span class="icon">
                <img src="./icons/Vendegvaras.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.welcome.time"></strong>
                <p data-i18n="schedule.items.welcome.label"></p>
            </div>
        </li>

        <li class="reveal">
            <span class="icon">
                <img src="./icons/Szertartas.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.ceremony.time"></strong>
                <p data-i18n="schedule.items.ceremony.label"></p>
            </div>
        </li>

        <li class="reveal">
            <span class="icon">
                <img src="./icons/Fotozas.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.photos.time"></strong>
                <p data-i18n="schedule.items.photos.label"></p>
            </div>
        </li>

        <li class="reveal">
            <span class="icon">
                <img src="./icons/Vacsora.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.dinner.time"></strong>
                <p data-i18n="schedule.items.dinner.label"></p>
            </div>
        </li>

        <li class="reveal">
            <span class="icon">
                <img src="./icons/Nyitotanc.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.party.time"></strong>
                <p data-i18n="schedule.items.party.label"></p>
            </div>
        </li>

        <li class="reveal">
            <span class="icon">
                <img src="./icons/Tortazas.png" alt="" aria-hidden="true" class="reveal" />
            </span>
            <div class="content">
                <strong data-i18n="schedule.items.cake.time"></strong>
                <p data-i18n="schedule.items.cake.label"></p>
            </div>
        </li>
    </ul>
</section>

<section id="naszajandek" class="section alt reveal">
    <h2 data-i18n="gift.title"></h2>
    <p class="section-text" data-i18n="gift.p1"></p>
    <p class="section-text" data-i18n="gift.p2"></p>
    <p class="section-text" data-i18n="gift.p3"></p>
</section>

<section class="section alt gallery-section" aria-label="Esküvői képek">
    <template class="gallery-source">
        <figure class="gallery-card"><img src="./pics/DSC_4965.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5004.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_4977.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5023.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_4999.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5140.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5095.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5249.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5214.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5255.JPEG" alt=""  /></figure>
        <figure class="gallery-card"><img src="./pics/DSC_5219.JPEG" alt=""  /></figure>
    </template>
    <blockquote class="gallery-quote">
        <p>
            A jóérzés köztünk marad,<br />
            míg a szívünk összeér,<br />
            s ez ok rá, hogy azt akarjam,<br />
            örökké velem legyél!
        </p>
        <cite>Aranyosi Ervin</cite>
    </blockquote>
</section>

<section id="dresscode" class="section alt reveal">
    <h2 data-i18n="dresscode.title"></h2>

    <div class="dresscode-text">
        <p data-i18n="dresscode.p1"></p>
        <p data-i18n="dresscode.p2"></p>
        <p data-i18n="dresscode.p3"></p>
    </div>

    <div class="color-palette">
        <div class="color-item">
            <span class="color-circle gold"></span>
        </div>
        <div class="color-item">
            <span class="color-circle beige"></span>
        </div>
        <div class="color-item">
            <span class="color-circle olive-green"></span>
        </div>
        <div class="color-item">
            <span class="color-circle green"></span>
        </div>
        <div class="color-item">
            <span class="color-circle bronzer"></span>
        </div>
        <div class="color-item">
            <span class="color-circle chocolate"></span>
        </div>
        <div class="color-item">
            <span class="color-circle rose-gold"></span>
        </div>
        <div class="color-item">
            <span class="color-circle rose-gold2"></span>
        </div>
    </div>
</section>

<section id="menu" class="section alt reveal">
    <h2 data-i18n="menu.title"></h2>
    <div class="menu">
        <div>
            <h3 data-i18n="menu.items.appetizer.title"></h3>
            <p data-i18n="menu.items.appetizer.description"></p>
        </div>
        <div>
            <h3 data-i18n="menu.items.main.title"></h3>
            <p data-i18n="menu.items.main.description"></p>
        </div>
        <div>
            <h3 data-i18n="menu.items.late.title"></h3>
            <p data-i18n="menu.items.late.description"></p>
        </div>
    </div>
</section>

<section id="visszaigazolas" class="section alt reveal">
    <h2 data-i18n="rsvp.title"></h2>

    <div class="rsvp-simple">
        <p class="rsvp-question" data-i18n="rsvp.question"></p>
        <p class="rsvp-deadline" data-i18n="rsvp.deadline"></p>

        <div class="rsvp-buttons">
            <button class="rsvp-btn yes" onclick="showForm(true)" data-i18n="rsvp.yesButton"></button>
            <button class="rsvp-btn no" onclick="showForm(false)" data-i18n="rsvp.noButton"></button>
        </div>

        <div id="form-container"></div>
    </div>
</section>


<footer class="footer">
    <p data-i18n="footer.invite"></p>
</footer>
</main>

<script src="js/i18n-data.js" defer></script>
<script src="js/i18n.js" defer data-i18n-file="i18n/i18n.json" data-i18n-default="hu"></script>
<script src="js/gallery-flow.js" defer></script>
<script src="js/main.js" defer></script>

</body>
</html>
